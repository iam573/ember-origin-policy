      <h2>常见问题</h2>
      <ul>
        <li>绕圈没有反应：请允许动作传感器权限，也可轻触圆盘三次完成净化。</li>
        <li>掷杯没有反应：可点击“上抛圣杯”，或从圣杯区域向上滑动。</li>
        <li>签卡无法保存：请在系统设置中允许赛博圣杯写入相册。</li>
        <li>如需删除记录：可在“签册”中删除单条签文，或在“设置”中清空本机数据。</li>
      </ul>
